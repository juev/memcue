name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: install model-free native Claude test client
        run: npm install --prefix "$RUNNER_TEMP/claude-client" --no-audit --no-fund --maxsockets=2 @anthropic-ai/claude-code@2.1.301

      # make test discovers native provider/lifecycle tests as well as the optional
      # provider-only stubs. Supply the real package in this job too.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: install pinned Hermes for native tests
        run: python3 -m pip install --disable-pip-version-check 'hermes-agent==0.17.0'

      - name: release prerequisite regression
        run: node --test --test-concurrency=2 plugins/claude-code/test/release-prerequisites.test.mjs

      - name: test
        run: make test CLAUDE_BIN="$RUNNER_TEMP/claude-client/node_modules/.bin/claude"

      # The plugin tags (dsh-v*, pi-v*) share the namespace; goreleaser OSS cannot filter them, so it gets both tags (#740).
      - name: previous release tag
        id: tags
        run: |
          previous=$(make -s previous-release TAG="$GITHUB_REF_NAME")
          echo "previous=$previous" >> "$GITHUB_OUTPUT"

      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
          GORELEASER_PREVIOUS_TAG: ${{ steps.tags.outputs.previous }}
