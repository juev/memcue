name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    outputs:
      npm-artifact-id: ${{ steps.npm-packages.outputs.artifact-id }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: install model-free native Claude test client
        run: npm install --prefix "$RUNNER_TEMP/claude-client" --no-audit --no-fund --maxsockets=2 @anthropic-ai/claude-code@2.1.301

      # make test discovers native provider/lifecycle tests as well as the optional
      # provider-only stubs. Supply the real package in this job too.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: install pinned Hermes for native tests
        run: python3 -m pip install --disable-pip-version-check 'hermes-agent==0.17.0'

      - name: install pinned Pi test dependencies
        run: npm --prefix plugins/pi ci --ignore-scripts --no-audit --no-fund

      - name: install the OpenCode plugin dependencies
        run: npm --prefix plugins/opencode ci --ignore-scripts --no-audit --no-fund

      - name: Check the tag and manifest versions
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"
          node --test plugins/claude-code/test/versions.test.mjs

      - name: release prerequisite regression
        run: node --test --test-concurrency=2 plugins/claude-code/test/release-prerequisites.test.mjs

      - name: test
        run: make test CLAUDE_BIN="$RUNNER_TEMP/claude-client/node_modules/.bin/claude"

      - name: pack and test npm tarballs
        run: make test-npm-packages NPM_PACK_DIR="$RUNNER_TEMP/npm-packages"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        id: npm-packages
        with:
          name: npm-packages-${{ github.run_attempt }}
          path: ${{ runner.temp }}/npm-packages/*.tgz
          if-no-files-found: error

      # Historical plugin tags share the namespace; select the previous binary tag explicitly (#740).
      - name: previous release tag
        id: tags
        run: |
          previous=$(make -s previous-release TAG="$GITHUB_REF_NAME")
          echo "previous=$previous" >> "$GITHUB_OUTPUT"

      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
          GORELEASER_PREVIOUS_TAG: ${{ steps.tags.outputs.previous }}

  # Plugins auto-install the binary of their release. Publish the binary before any npm package.
  npm:
    name: publish ${{ matrix.package }}
    needs: goreleaser
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [memcue-dsh, memcue-pi, memcue-opencode]
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Require the tested artifact ID
        env:
          NPM_ARTIFACT_ID: ${{ needs.goreleaser.outputs.npm-artifact-id }}
        run: '[[ "$NPM_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]'

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.goreleaser.outputs.npm-artifact-id }}
          path: ${{ runner.temp }}/npm-packages

      # npm Trusted Publishing: authorize release.yml on each package; no npm write token.
      - name: Publish
        env:
          PACKAGE: ${{ matrix.package }}
        run: node scripts/publish-npm.mjs "$PACKAGE" "$GITHUB_REF_NAME" "$RUNNER_TEMP/npm-packages"
