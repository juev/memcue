name: Publish dsh plugin

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Pack and report without publishing"
        type: boolean
        default: false
  push:
    tags:
      - "dsh-v*"

permissions:
  contents: read
  id-token: write

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      # Since #754 the npm package and the GitHub bundle are one package at the repository root, so the tag,
      # the syntax check and the publish all read the root manifest.
      - name: Check the tag names the package version
        if: startsWith(github.ref, 'refs/tags/dsh-v')
        run: test "dsh-v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"

      - name: Check the entry syntax and the transport subpath
        run: |
          node --check plugins/deepseek-harness/src/index.mjs
          node --input-type=module -e "await import('memcue-dsh/transport')"

      # npm Trusted Publishing: the OIDC token comes from id-token: write, so
      # there is no NPM_TOKEN. Provenance is added by the trusted publisher.
      - name: Publish
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            # A dry run still refuses a version that already exists, so pack a
            # throwaway prerelease and never upload it.
            npm version "$(node -p "require('./package.json').version")-dryrun.$(date +%s)" \
              --no-git-tag-version --allow-same-version >/dev/null
            npm publish --access public --dry-run --tag dryrun
          else
            npm publish --access public
          fi