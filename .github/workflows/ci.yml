name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: build / test / lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      # Builds bin/memcue, runs the Go tests with -race and the Hermes plugin tests against that binary.
      - name: test
        run: make test

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13
