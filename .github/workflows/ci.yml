name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: build / test / lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: install model-free native Claude test client
        run: npm install --prefix "$RUNNER_TEMP/claude-client" --no-audit --no-fund --maxsockets=2 @anthropic-ai/claude-code@2.1.301

      # make test discovers native provider/lifecycle tests as well as the optional
      # provider-only stubs. Supply the real package in this job too.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: install pinned Hermes for native tests
        run: python3 -m pip install --disable-pip-version-check 'hermes-agent==0.17.0'

      # Builds bin/memcue, runs the Go tests with -race and the Hermes plugin tests against that binary.
      - name: test
        run: make test CLAUDE_BIN="$RUNNER_TEMP/claude-client/node_modules/.bin/claude"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0

  plugins:
    name: dsh / claude-code / pi plugins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      # The plugin imports the harness packages as peers. Pin the tested runtime so a new API cannot slip in
      # unnoticed; the repository root is a dsh bundle, so the packages resolve from the checkout.
      - name: install harness packages
        run: npm install --no-save --no-package-lock @deepseek-ai/dsh-llm@0.2.0-rc.2 @deepseek-ai/dsh-tools@0.2.0-rc.2

      # Jobs do not share binaries: the native DSH and Claude Code tests execute the real CLI.
      - name: build memcue
        run: go build -p 2 -o bin/memcue ./cmd/memcue

      - name: test plugins
        run: MEMCUE_BIN="$PWD/bin/memcue" node --experimental-test-module-mocks --test --test-concurrency=2 plugins/deepseek-harness/test/*.test.mjs plugins/claude-code/test/*.test.mjs

      # The Pi plugin pins the tested Pi SDK in its own devDependencies.
      - name: install Pi SDK
        run: npm install --prefix plugins/pi --no-package-lock --no-audit --no-fund

      - name: typecheck Pi plugin
        working-directory: plugins/pi
        run: npx tsc --noEmit

      - name: test Pi plugin
        working-directory: plugins/pi
        run: MEMCUE_BIN="$GITHUB_WORKSPACE/bin/memcue" node --experimental-strip-types --test --test-concurrency=1 test/*.test.ts

  card-research:
    name: card research contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Synthetic fixtures only: no provider credentials, private corpus, or model calls.
      - name: test card audit and replay contracts
        run: |
          umask 077
          export TMPDIR="$(mktemp -d "$RUNNER_TEMP/memcue-card-research.XXXXXX")"
          python3 -I -B docs/research/scripts/test_card_audit_606.py
          python3 -I -B docs/research/scripts/card606/test_label606.py
          python3 -I -B docs/research/scripts/card606/test_replay606.py

  hermes-contract:
    name: hermes contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: build memcue
        run: go build -o bin/memcue ./cmd/memcue

      # The in-tree tests stub MemoryProvider when Hermes is missing. This job installs the pinned real package
      # so the contract test checks the actual abstract API and on_session_switch signature.
      - name: install Hermes
        run: |
          python3 -m venv /tmp/hermes-venv
          /tmp/hermes-venv/bin/python -m pip install --disable-pip-version-check 'hermes-agent==0.17.0'

      # MEMCUE_REQUIRE_HERMES fails the run when Hermes does not import, instead of falling back to the stubs.
      - name: test against real Hermes
        run: |
          MEMCUE_REQUIRE_HERMES=1 MEMCUE_BIN="$PWD/bin/memcue" \
            /tmp/hermes-venv/bin/python plugins/hermes/memcue/tests/test_provider.py

      - name: test native local outcome and lifecycle contracts
        run: MEMCUE_BIN="$PWD/bin/memcue" /tmp/hermes-venv/bin/python -I -m unittest discover -s plugins/hermes -p 'test_*.py' -v

      - name: test released normal-plugin request bridge
        run: |
          MEMCUE_BIN="$PWD/bin/memcue" /tmp/hermes-venv/bin/python -I plugins/hermes/test_request_context.py -v

      # An installed plugin is a copy of plugins/hermes/memcue alone, without the rest of the checkout (#526).
      - name: test an installed copy against real Hermes
        run: |
          home="$(mktemp -d)"
          mkdir -p "$home/plugins"
          cp -r plugins/hermes/memcue "$home/plugins/memcue"
          cp -r plugins/hermes/memcue-context "$home/plugins/memcue-context"
          cp plugins/hermes/test_request_context.py "$home/plugins/test_request_context.py"
          cd "$home"
          HERMES_HOME="$home" MEMCUE_REQUIRE_HERMES=1 MEMCUE_BIN="$GITHUB_WORKSPACE/bin/memcue" \
            /tmp/hermes-venv/bin/python "$home/plugins/memcue/tests/test_provider.py"

      - name: test installed normal-plugin pair
        run: |
          home="$(mktemp -d)"
          mkdir -p "$home/plugins"
          cp -r plugins/hermes/memcue plugins/hermes/memcue-context "$home/plugins/"
          cp plugins/hermes/test_request_context.py "$home/plugins/"
          cd "$home"
          MEMCUE_BIN="$GITHUB_WORKSPACE/bin/memcue" /tmp/hermes-venv/bin/python -I "$home/plugins/test_request_context.py" -v
