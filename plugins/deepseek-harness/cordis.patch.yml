# memcue for DeepSeek Harness — overlay template.
#
# Copy into $DSH_HOME/cordis.patch.yml (all profiles) or
# $DSH_HOME/profiles/<name>/cordis.patch.yml (one profile), and replace both absolute
# paths. A run-scoped check: dsh --profile headless --patch ./cordis.patch.yml "..."
- insert:
    - id: memcue
      name: '/absolute/path/to/memcue/plugins/deepseek-harness/src/index.ts'
      config:
        binary: '/absolute/path/to/memcue'
        facts: '/absolute/path/to/facts.db'
        extract: true
        minNewChars: 2000
