name: memcue
version: 0.18.0
description: "memcue — long-term memory as a base of atomic facts: the model searches it with memcue_search, the session card rides with the first turn, built-in memory writes are mirrored into it, facts can expire. Runs the memcue binary."
external_dependencies:
  - name: memcue
    install: "installed by the provider from the release unless MEMCUE_AUTO_INSTALL=0; or go install github.com/juev/memcue/cmd/memcue@latest, or a release binary on PATH"
    check: "memcue version"
